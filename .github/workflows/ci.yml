name: CI
on: [push, pull_request]
env:
  WRANGLER_SEND_METRICS: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 本地 D1（Miniflare）：验证迁移与种子 SQL 都能执行
      - run: npm run db:migrate:local
      - run: npm run db:seed:local
      # 构建 Cloudflare Workers 产物
      - run: npx opennextjs-cloudflare build
        env:
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 437b1bdabc05d0305e7cad723ba38cde
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Resolve Cloudflare D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          databases="$(npx wrangler d1 list --json --config wrangler.jsonc)"
          database_id="$(printf '%s' "$databases" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const rows = Array.isArray(data) ? data : (data.result ?? data.databases ?? []);
              const matches = rows.filter(row => row.name === "deepread");
              if (matches.length > 1) {
                console.error("More than one D1 database is named deepread; refusing to choose.");
                process.exit(2);
              }
              const row = matches[0];
              process.stdout.write(row ? (row.uuid ?? row.database_id ?? row.id ?? "") : "");
            });
          ')"
          created=false
          if [ -z "$database_id" ]; then
            create_output="$(npx wrangler d1 create deepread --json --config wrangler.jsonc)"
            database_id="$(printf '%s' "$create_output" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1 || true)"
            if [ -z "$database_id" ]; then
              echo "Could not read the new D1 database ID from Wrangler output." >&2
              exit 1
            fi
            created=true
          fi
          DB_ID="$database_id" node -e '
            const fs = require("node:fs");
            const path = "wrangler.jsonc";
            const config = fs.readFileSync(path, "utf8");
            const id = process.env.DB_ID;
            const pattern = /("database_id"\s*:\s*")[^"]+(")/;
            if (!pattern.test(config)) throw new Error("Could not find database_id in wrangler.jsonc");
            const updated = config.replace(pattern, (_, before, after) => before + id + after);
            fs.writeFileSync(path, updated);
          '
          echo "Resolved D1 database: $database_id"
          echo "created=$created" >> "$GITHUB_OUTPUT"
      - run: npm run db:migrate:remote
      - name: Check whether the D1 database needs seed data
        id: seed_check
        shell: bash
        run: |
          result="$(npx wrangler d1 execute deepread --remote --json --command "SELECT (SELECT COUNT(*) FROM users) AS users_count, (SELECT COUNT(*) FROM passages) AS passages_count, (SELECT COUNT(*) FROM schools) AS schools_count;" --config wrangler.jsonc)"
          row_count="$(printf '%s' "$result" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(input);
              const batches = Array.isArray(parsed) ? parsed : [parsed];
              const rows = batches.flatMap(batch => batch.results ?? []);
              if (rows.length !== 1) throw new Error("Could not read D1 seed status.");
              const row = rows[0];
              const total = Number(row.users_count) + Number(row.passages_count) + Number(row.schools_count);
              process.stdout.write(String(total));
            });
          ')"
          if [ "$row_count" = "0" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Seed empty database
        if: steps.seed_check.outputs.empty == 'true'
        run: npm run db:seed:remote
      - run: npm run deploy
